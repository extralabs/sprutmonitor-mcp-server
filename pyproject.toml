[project]
name = "sprutmonitor-mcp"
version = "0.5.1"
description = "Read-only MCP server for SprutMonitor DLP Cloud (sprutmonitor.ru) - risks, idle time, productivity, and employee monitoring for Cursor, Claude, and VS Code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "SprutMonitor" }]
keywords = [
  "mcp",
  "mcp-server",
  "model-context-protocol",
  "sprutmonitor",
  "sprutmonitor-dlp",
  "dlp",
  "employee-monitoring",
  "productivity",
  "security",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "mcp[cli]>=2.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "typing-extensions>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
sprutmonitor-mcp = "sprutmonitor_mcp.server:main"

[project.urls]
Homepage = "https://sprutmonitor.ru/"
Documentation = "https://sprutmonitor.ru/docs/"
Console = "https://app.sprutmonitor.ru/"
API = "https://app.sprutmonitor.ru/api/"
Repository = "https://github.com/extralabs/sprutmonitor-mcp-server"
Issues = "https://github.com/extralabs/sprutmonitor-mcp-server/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sprutmonitor_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ001"]
